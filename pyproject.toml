[project]
name = "aquacrop-slovenia"
version = "0.1.0"
description = "Code to calibrate Aquacrop for two sites in Slovenia. Calibrated parameters are used to make yield projections under different climate scenarios."
authors = [
  { name = "Rok Kuk" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cma>=3.4.0",
    "cartopy>=0.23.0",
    "dask>=2026.3.0",
    "datashader>=0.19.0",
    "geopandas>=1.1.3",
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "netCDF4>=1.7.0",
    "numpy>=2.4.4",
    "pandas>=2.2.0",
    "pandas-stubs~=2.2.2",
    "pyaquacrop>=0.1.4",
    "pyarrow>=24.0.0",
    "pylint>=4.0.5",
    "pyrefly>=0.60.0",
    "ruff>=0.15.12",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "scipy-stubs~=1.18.0",
    "setuptools>=82.0.1",
    "tqdm>=4.67.3",
    "xarray>=2024.1.0",
    "rosetta-soil>=0.3.2",
]

[tool.ruff]
line-length = 99
src = ["aquacrop_slovenia"]
include = ["pyproject.toml", "aquacrop_slovenia/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["aquacrop_slovenia"]
force-sort-within-sections = true

[dependency-groups]
dev = []
